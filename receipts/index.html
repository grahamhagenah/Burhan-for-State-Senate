      <section className="page-hero motif-bg">
        <Reveal className="page-hero-grid">

            <span className="kicker">The Candidate</span>
            <h1>Burhan Azeem</h1>
            <p>Burhan is a transit rider, the founder of Abundant Housing Massachusetts, and the Vice Mayor of Cambridge.</p>
            <p style={{ marginTop: 18 }}>Growing up, his family relied on Medicaid and food stamps, so he knows the power of helpful public policy. After graduating from MIT and becoming an EMT, he struggled to find an affordable apartment. So he stopped waiting for someone else to fix the problem, ran for office, and became Cambridge&rsquo;s youngest City Councilor.</p>
            <p style={{ marginTop: 18 }}>During his tenure, he has re-legalized multifamily housing, delivered universal pre-K, and brought greater transparency to local government.</p>
            <p style={{ marginTop: 18 }}>Now he&rsquo;s running for Senate to do even more: more housing, a faster T, and a State House that actually works.</p>

      <SiteFooter headline="And this is just the beginning." sub="Help send a proven problem solver to the State Senate." />
    </div>);

}
