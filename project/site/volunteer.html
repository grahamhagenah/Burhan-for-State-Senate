<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Burhan for Senate — Volunteer</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="volunteer.jsx"></script>

<script type="text/babel">

const VOL_DEFAULTS = /*EDITMODE-BEGIN*/{
  "layout": "Split"
} /*EDITMODE-END*/;

function VolunteerApp() {
  const [t, setTweak] = useTweaks(VOL_DEFAULTS);
  return (
    <div className="site">
      <SiteHeader active="Volunteer" />

      <section className="page-hero motif-bg vol-hero">
        <Reveal style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center" }}>
          <span className="kicker">Get involved</span>
          <h1>Join the movement</h1>
        </Reveal>
      </section>

      <VolunteerBody layout={t.layout} />

      <SiteFooter headline="More is possible" sub="Can't volunteer right now? A donation goes just as far." />

      <TweaksPanel>
        <TweakSection label="Page layout" />
        <TweakRadio label="Form layout" value={t.layout}
        options={["Split", "Centered"]}
        onChange={(v) => setTweak("layout", v)} />
      </TweaksPanel>
    </div>);

}
ReactDOM.createRoot(document.getElementById("root")).render(<VolunteerApp />);
</script>
</body>
</html>
